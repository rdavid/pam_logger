---
name: actionlint
'on': [pull_request, push]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - id: get
        run: |
          ver=1.7.12
          srv=https://raw.githubusercontent.com/rhysd/actionlint
          url=$srv/v$ver/scripts/download-actionlint.bash
          bash <(curl --silent "$url") "$ver"
      - run: ${{ steps.get.outputs.executable }}
