---
name: cppcheck
'on':
  pull_request:
    paths: &paths
      - main.c
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  cppcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes cppcheck
      - run: >
          cppcheck --enable=warning,style,performance,portability
          --error-exitcode=1 --inline-suppr
          --suppress=missingIncludeSystem main.c
